[pytest]
# testpaths restricts test discovery to these directories — without it,
# pytest would also try to collect tests from anywhere else in the
# project (like frontend/node_modules, if run from the repo root),
# which is both slow and can pick up irrelevant files.
testpaths = tests

# Makes assertion failure output show full detail (variable values,
# not just "assert False") for every assertion, not just the first one
# per test file — genuinely useful for actually debugging a failure
# instead of having to add print statements.
addopts = -v --tb=short
