# nginx.conf
# ==========
# A reverse proxy sits IN FRONT of your actual application servers and
# is the thing the public internet talks to directly. Why not just
# expose uvicorn/next directly to the internet?
#   1. TLS TERMINATION: the reverse proxy handles the HTTPS
#      encryption/decryption ONCE, at the edge, so your application
#      code never has to deal with certificates at all — it just
#      speaks plain HTTP to Nginx over the local network.
#   2. Routing: one domain (yourapp.com) can route /api/* to the
#      backend and everything else to the frontend, without the
#      frontend and backend needing to know about each other's exact
#      ports.
#   3. It can also do things application code shouldn't have to:
#      rate limiting, request buffering, serving static files directly
#      without hitting the app server at all, and gzip compression.
#
# HONEST STATUS: like the other infrastructure configs in this project
# (Docker Compose, the full stack), this has not been runtime-verified
# against a live server in the sandbox this project was built in — no
# real domain, no real TLS certificate issuance was possible here. It
# follows Nginx's and Let's Encrypt/Certbot's standard, documented
# configuration pattern.

# Redirect all plain HTTP traffic to HTTPS -- nothing should be served
# unencrypted.
server {
    listen 80;
    server_name yourapp.com www.yourapp.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name yourapp.com www.yourapp.com;

    # These certificate paths are what Certbot (Let's Encrypt's official
    # client) creates automatically when you run:
    #   certbot --nginx -d yourapp.com -d www.yourapp.com
    # Certbot also auto-renews these certificates (they expire every 90
    # days) via a scheduled cron job it sets up for you — this is why
    # Let's Encrypt made free, trusted HTTPS practical for everyone,
    # versus the paid, manually-renewed certificates of a decade ago.
    ssl_certificate     /etc/letsencrypt/live/yourapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourapp.com/privkey.pem;

    # Route API traffic to the FastAPI backend container.
    location /api/ {
        # rewrite strips the leading /api so the backend sees clean
        # paths like /documents/upload rather than /api/documents/upload
        # -- keeping the backend's own route definitions unaware of
        # this proxy-level prefixing decision entirely.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;

        # These headers forward information the backend would
        # otherwise lose, since from the backend's perspective every
        # request now appears to come from Nginx (the proxy), not the
        # real client.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # File uploads (our /documents/upload endpoint) can be large --
        # this raises Nginx's default 1MB body size limit so a
        # multi-page scanned PDF upload isn't rejected at the proxy
        # layer before it even reaches our application code.
        client_max_body_size 25M;
    }

    # Everything else routes to the Next.js frontend.
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
